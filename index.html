<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium AI Assistant UI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at top, #1a1635 0%, #0b0813 100%);
            --container-bg: #0b0813;
            --sidebar-bg: #0f0c1b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #231d3d;
            --card-bg: rgba(30, 27, 57, 0.4);
            --card-hover: rgba(45, 40, 85, 0.6);
            --accent-color: #635bff;
            --accent-glow: rgba(99, 91, 255, 0.4);
            --chat-user-msg: #635bff;
            --chat-bot-msg: #1e1b39;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            position: relative;
            overflow: hidden;
            background: transparent;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 260px;
            height: 100%;
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 24px;
            gap: 16px;
            border-right: 1px solid var(--border-color);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            flex-shrink: 0;
        }

        .sidebar-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
            margin-left: 12px;
        }

        .nav-row {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 12px;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-row i {
            font-size: 1.1rem;
            width: 24px;
            text-align: center;
        }

        .nav-row.active {
            background-color: var(--accent-color);
            color: #ffffff;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .nav-row:hover:not(.active) {
            color: var(--text-color);
            background-color: var(--card-bg);
        }

        /* Main Chat Layout */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .chat-header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .menu-hamburger {
            font-size: 1.3rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
        }

        .menu-hamburger:hover {
            color: var(--text-color);
        }

        .header-info h2 {
            font-size: 1.1rem;
            color: var(--text-color);
            font-weight: 600;
        }

        .header-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .google-header-btn {
            margin-left: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            overflow: hidden;
        }

        .google-header-btn:hover {
            background-color: var(--card-hover);
            transform: scale(1.05);
        }
        
        .user-avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        /* Welcome Screen with Glowing Bot */
        .welcome-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            overflow-y: auto;
        }

        .big-bot-avatar {
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, #2a2254 0%, #15102a 100%);
            color: #b3aaff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.5rem;
            margin-bottom: 24px;
            position: relative;
            box-shadow: 0 0 40px rgba(99, 91, 255, 0.25), inset 0 0 20px rgba(99, 91, 255, 0.2);
            animation: float 3s ease-in-out infinite;
        }

        .big-bot-avatar::after {
            content: '';
            position: absolute;
            width: 160px;
            height: 160px;
            border: 2px solid rgba(138, 126, 255, 0.3);
            border-radius: 50%;
            animation: pulse 2s linear infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .welcome-screen h1 {
            font-size: 3rem;
            color: var(--text-color);
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .welcome-screen p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        /* Suggestion Cards Container */
        .suggestions-container {
            display: flex;
            gap: 12px;
            max-width: 850px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .suggestion-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            flex: 1;
            min-width: 200px;
            max-width: 260px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .suggestion-card:hover {
            background: var(--card-hover);
            border-color: #4c438e;
            transform: translateY(-2px);
        }

        .card-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-icon {
            width: 36px;
            height: 36px;
            background: rgba(99, 91, 255, 0.15);
            color: #a39cff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .suggestion-card span {
            font-size: 0.9rem;
            font-weight: 500;
            color: #e2e8f0;
        }

        .suggestion-card i.fa-chevron-right {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Chat History Box */
        .dynamic-chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            display: none; 
            flex-direction: column;
            gap: 20px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            padding: 14px 20px;
            border-radius: 20px;
            max-width: 75%;
            font-size: 0.98rem;
            line-height: 1.6;
        }

        .user-msg {
            background-color: var(--chat-user-msg);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(99, 91, 255, 0.3);
        }

        .bot-msg {
            background-color: var(--chat-bot-msg);
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        /* Dots Loader Animation */
        .dots-container {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 15px 20px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* Footer Input Area styling */
        .bottom-container {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            padding-top: 10px;
            padding-bottom: 15px;
            flex-shrink: 0;
            text-align: center;
        }

        .input-bar-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            margin-bottom: 12px;
        }

        .plus-btn {
            width: 50px;
            height: 50px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            color: var(--text-color);
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .plus-btn:hover {
            background: var(--card-hover);
            border-color: #4c438e;
        }

        .input-bar {
            flex: 1;
            display: flex;
            align-items: center;
            background-color: rgba(18, 15, 38, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 6px 6px 6px 20px;
        }

        .input-bar:focus-within {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(99, 91, 255, 0.15);
        }

        .input-bar input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 1rem;
            color: var(--text-color);
            background: transparent;
            height: 44px;
        }

        .input-bar input::placeholder {
            color: #524d75;
        }

        .send-btn {
            width: 44px;
            height: 44px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: all 0.2s;
            box-shadow: 0 4px 10px var(--accent-glow);
        }

        .send-btn:hover {
            transform: scale(1.03);
            background-color: #5249f0;
        }

        .disclaimer {
            font-size: 0.78rem;
            color: #524d75;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Overlay */
        .chat-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 999;
        }

        /* Settings Modal Styling */
        .settings-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 400px;
            background-color: #120f26;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            z-index: 1001;
            border: 1px solid var(--border-color);
        }

        .settings-modal.active {
            display: block;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-modal-btn {
            font-size: 1.2rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .setting-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }

        .setting-btn.danger {
            background-color: #ef4444;
        }

        /* Responsive Logic */
        @media (max-width: 1024px) {
            .sidebar {
                position: absolute;
                top: 0;
                left: 0;
                transform: translateX(-100%); 
                width: 280px;
            }

            .sidebar.active {
                transform: translateX(0); 
            }

            .chat-overlay.active {
                display: block; 
            }
        }

        @media (min-width: 1025px) {
            .menu-hamburger {
                display: none; 
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="chat-overlay" id="chatOverlay"></div>

        <div class="settings-modal" id="settingsModal">
            <div class="modal-header">
                <h3>Settings</h3>
                <div class="close-modal-btn" id="closeModalBtn"><i class="fas fa-times"></i></div>
            </div>
            <div class="setting-item">
                <span>Theme Toggle</span>
                <button class="setting-btn" id="themeToggleBtn">Light Mode Trigger</button>
            </div>
            <div class="setting-item">
                <span>Chat History</span>
                <button class="setting-btn danger" id="clearChatBtn">Clear Chat</button>
            </div>
        </div>

        <div class="sidebar" id="popupSidebar">
            <div class="sidebar-title">Menu</div>
            <div class="nav-row active" id="newChatNav" title="New Chat">
                <i class="fas fa-comment-dots"></i>
                <span>New Chat</span>
            </div>
            <div class="nav-row" id="historyNavBtn" title="Chat History">
                <i class="far fa-clock"></i>
                <span>History</span>
            </div>
            <div class="nav-row" id="settingsNav" title="Settings">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </div>
        </div>

        <div class="main-chat">
            <div class="chat-header">
                <div class="menu-hamburger" id="menuDotsBtn"><i class="fas fa-bars"></i></div>
                <div class="header-info">
                    <h2>AI Assistant</h2>
                    <p id="welcomeUserSub">Smart AI. Better Answers.</p>
                </div>
                
                <button class="google-header-btn" id="googleLoginBtn" title="Continue with Google">
                    <img id="googleIcon" src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google" style="width:20px;height:20px;">
                </button>
            </div>

            <div class="welcome-screen" id="welcomeScreen">
                <div class="big-bot-avatar"><i class="fas fa-robot"></i></div>
                <h1 id="mainGreeting">Hello!</h1>
                <p>How can I help you today?</p>

                <div class="suggestions-container">
                    <div class="suggestion-card" onclick="sendSuggestion('Explain quantum computing')">
                        <div class="card-content">
                            <div class="card-icon"><i class="fas fa-wand-magic-sparkles"></i></div>
                            <span>Explain quantum<br>computing</span>
                        </div>
                        <i class="fas fa-chevron-right"></i>
                    </div>
                    <div class="suggestion-card" onclick="sendSuggestion('Write a cover letter')">
                        <div class="card-content">
                            <div class="card-icon"><i class="far fa-file-alt"></i></div>
                            <span>Write a<br>cover letter</span>
                        </div>
                        <i class="fas fa-chevron-right"></i>
                    </div>
                    <div class="suggestion-card" onclick="sendSuggestion('Ideas for side hustle')">
                        <div class="card-content">
                            <div class="card-icon"><i class="far fa-lightbulb"></i></div>
                            <span>Ideas for<br>side hustle</span>
                        </div>
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>
            </div>

            <div class="dynamic-chat-box" id="dynamicChatBox"></div>

            <div class="bottom-container">
                <div class="input-bar-wrapper">
                    <button class="plus-btn" title="Add files"><i class="fas fa-plus"></i></button>
                    <div class="input-bar">
                        <input type="text" id="chatInput" placeholder="Type your message..." autocomplete="off">
                        <button class="send-btn" id="sendArrowBtn"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
                <div class="disclaimer">
                    <i class="fas fa-lock"></i>
                    <span>AI can make mistakes. Check important info.</span>
                </div>
            </div>
        </div>
    </div>

  <script>
        // BACKEND BASE URL Configuration
        // Agar local run kar rahe ho toh: 'http://localhost:5000' use karna
        const BASE_URL = 'https://back-chatbot-fw5n.onrender.com'; 

        const chatInput = document.getElementById('chatInput');
        const sendArrowBtn = document.getElementById('sendArrowBtn');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const dynamicChatBox = document.getElementById('dynamicChatBox');
        
        const menuDotsBtn = document.getElementById('menuDotsBtn');
        const popupSidebar = document.getElementById('popupSidebar');
        const chatOverlay = document.getElementById('chatOverlay');
        const settingsNav = document.getElementById('settingsNav');
        const newChatNav = document.getElementById('newChatNav');
        const historyNavBtn = document.getElementById('historyNavBtn');
        const googleLoginBtn = document.getElementById('googleLoginBtn');
        const googleIcon = document.getElementById('googleIcon');
        const mainGreeting = document.getElementById('mainGreeting');
        const welcomeUserSub = document.getElementById('welcomeUserSub');
        
        const settingsModal = document.getElementById('settingsModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const clearChatBtn = document.getElementById('clearChatBtn');

        // Unique Session Management logic
        if (!localStorage.getItem('sessionId')) {
            localStorage.setItem('sessionId', 'session_' + Math.random().toString(36).substr(2, 9));
        }
        let currentSessionId = localStorage.getItem('sessionId');

        // Google Authentication Logic Initialize
        window.onload = function () {
            google.accounts.id.initialize({
                client_id: "YOUR_GOOGLE_CLIENT_ID_HERE.apps.googleusercontent.com", // <-- Bhai apni actual Google Client ID yahan replace kar lena
                callback: handleCredentialResponse,
                ux_mode: "popup"
            });
        };

        function handleCredentialResponse(response) {
            const id_token = response.credential;

            // Token ko backend validation route par bhej rahe hain
            fetch(`${BASE_URL}/api/auth/google`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: id_token })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    // Unique Google User ID ko ab dynamic sessionId bana diya 
                    localStorage.setItem('sessionId', data.userId);
                    currentSessionId = data.userId;
                    
                    // Profile styling dynamics handle karna
                    mainGreeting.innerText = `Hello, ${data.name}!`;
                    welcomeUserSub.innerText = `Logged in as ${data.name}`;
                    alert(`Bhai login ho gaya! Welcome ${data.name}`);
                    
                    // Purani chat automatic load karne ke liye call lagaya
                    loadChatHistory();
                } else {
                    alert("Auth error: " + data.error);
                }
            })
            .catch(err => console.error("Login call dynamic failure:", err));
        }

        googleLoginBtn.addEventListener('click', () => {
            google.accounts.id.prompt(); // Makkhan Google Single-Sign-On popup trigger
        });

        function closeSidebar() {
            popupSidebar.classList.remove('active');
            chatOverlay.classList.remove('active');
        }

        menuDotsBtn.addEventListener('click', () => {
            popupSidebar.classList.add('active');
            chatOverlay.classList.add('active');
        });

        chatOverlay.addEventListener('click', () => {
            closeSidebar();
            settingsModal.classList.remove('active');
        });

        settingsNav.addEventListener('click', () => {
            if (window.innerWidth <= 1024) closeSidebar(); 
            chatOverlay.add('active'); 
            settingsModal.classList.add('active'); 
        });

        closeModalBtn.addEventListener('click', () => {
            settingsModal.classList.remove('active');
            chatOverlay.classList.remove('active');
        });

        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
        });

        function resetToWelcome() {
            dynamicChatBox.innerHTML = '';
            dynamicChatBox.style.display = 'none';
            welcomeScreen.style.display = 'flex';
        }

        clearChatBtn.addEventListener('click', () => {
            resetToWelcome();
            settingsModal.classList.remove('active');
            chatOverlay.classList.remove('active');
        });

        newChatNav.addEventListener('click', () => {
            resetToWelcome();
            if (window.innerWidth <= 1024) closeSidebar();
        });

        // Sidebar History Button par click karne se real history load hogi
        historyNavBtn.addEventListener('click', () => {
            loadChatHistory();
            if (window.innerWidth <= 1024) closeSidebar();
        });

        // Chat history fetch karne ka full function
        async function loadChatHistory() {
            try {
                const res = await fetch(`${BASE_URL}/api/history?sessionId=${currentSessionId}`);
                const data = await res.json();
                
                if(data.history && data.history.length > 0) {
                    welcomeScreen.style.display = 'none';
                    dynamicChatBox.style.display = 'flex';
                    dynamicChatBox.innerHTML = ''; // Pehle box khali karo
                    
                    data.history.forEach(item => {
                        if(item.user) createMsgNode(item.user, 'user-msg');
                        if(item.bot) createMsgNode(item.bot, 'bot-msg');
                    });
                    dynamicChatBox.scrollTop = dynamicChatBox.scrollHeight;
                } else {
                    alert("Bhai, filhal koi history nahi mili.");
                }
            } catch (error) {
                console.error("History pull request failed:", error);
            }
        }

        async function triggerMessage(forcedText = '') {
            const txt = forcedText ? forcedText.trim() : chatInput.value.trim();
            if (txt === '') return;

            if (welcomeScreen.style.display !== 'none') {
                welcomeScreen.style.display = 'none';
                dynamicChatBox.style.display = 'flex';
            }

            createMsgNode(txt, 'user-msg');
            if(!forcedText) chatInput.value = '';
            dynamicChatBox.scrollTop = dynamicChatBox.scrollHeight;

            const typingIndicator = createTypingIndicator(); 
            dynamicChatBox.scrollTop = dynamicChatBox.scrollHeight;

            try {
                // Backend ko user message ke sath currentSessionId bhi bhej rahe hain memory banaye rakhne ke liye
                const response = await fetch(`${BASE_URL}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: txt,
                        sessionId: currentSessionId
                    })
                });

                const data = await response.json();
                
                typingIndicator.classList.remove('dots-container');
                typingIndicator.innerHTML = ''; 
                typingIndicator.innerText = data.reply || "Backend responded with empty text.";

            } catch (error) {
                typingIndicator.classList.remove('dots-container');
                typingIndicator.innerHTML = '';
                typingIndicator.innerText = "Could not connect to server. Please try again later!";
                console.error("Error:", error);
            }

            dynamicChatBox.scrollTop = dynamicChatBox.scrollHeight;
        }

        function sendSuggestion(phrase) {
            triggerMessage(phrase);
        }

        function createMsgNode(text, className) {
            const div = document.createElement('div');
            div.classList.add('message', className);
            div.innerText = text;
            dynamicChatBox.appendChild(div);
            return div;
        }

        function createTypingIndicator() {
            const div = document.createElement('div');
            div.classList.add('message', 'bot-msg', 'dots-container');
            for (let i = 0; i < 3; i++) {
                const dot = document.createElement('div');
                dot.classList.add('dot');
                div.appendChild(dot);
            }
            dynamicChatBox.appendChild(div);
            return div;
        }

        sendArrowBtn.addEventListener('click', () => triggerMessage());

        chatInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                triggerMessage();
            }
        });
    </script>
</body>
</html>
