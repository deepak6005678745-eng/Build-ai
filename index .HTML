<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kewa Smart AI</title>
    <!-- Tailwind CSS (v4) for premium styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Material Symbols for clean modern outline icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <style>
        /* Modern scrollbar logic for active streams */
        .chat-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .chat-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background: #E5E7EB;
            border-radius: 20px;
        }
        /* Smooth state animation */
        .transition-all-smooth {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="bg-[#F4F5F7] h-[100dvh] w-screen flex items-center justify-center font-sans antialiased overflow-hidden p-2 sm:p-6">

    <!-- Global App Canvas Container (Dynamic Fit Frame) -->
    <div class="bg-[#F9FAFC] w-full max-w-6xl h-full rounded-[24px] shadow-2xl border border-gray-200/60 flex flex-col overflow-hidden relative">
        
        <!-- --- 1. TOP HEADER BAR --- -->
        <header class="flex justify-between items-center px-6 py-4 bg-white/60 backdrop-blur-md border-b border-gray-100 shrink-0 z-10">
            <!-- Sidebar Hamburger Menu Icon -->
            <button class="p-2 hover:bg-gray-100/80 active:scale-95 rounded-xl transition-all cursor-pointer">
                <span class="material-symbols-outlined text-gray-800 text-[26px] block">menu</span>
            </button>
            
            <!-- Elegant Google Sign-In Pill Component -->
            <button class="flex items-center gap-3 border border-gray-200/80 bg-white px-5 py-2 rounded-full text-sm font-semibold text-gray-700 hover:bg-gray-50 active:scale-98 transition-all shadow-sm cursor-pointer">
                <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/web-24dp/logo_googleg_color_24dp.png" alt="Google" class="w-4 h-4">
                <span>Sign in with Google</span>
            </button>
        </header>

        <!-- --- 2. THE MAIN STREAMING CONTAINER --- -->
        <main class="flex-1 overflow-y-auto chat-scroll px-4 sm:px-12 py-6 flex flex-col justify-between relative" id="chatWindow">
            
            <!-- Global Dynamic Centerpiece Header Block -->
            <div id="dynamicHeaderBlock" class="w-full flex flex-col items-center justify-center text-center transition-all-smooth my-auto">
                <!-- Premium Mascot Wrapper Group -->
                <div class="relative flex items-center justify-center mb-4 transition-all-smooth" id="mascotWrapper">
                    <!-- Outer Decorative Glowing Aura Circle Layer -->
                    <div class="absolute w-28 h-28 bg-[#EAE3FF]/50 rounded-full blur-xl"></div>
                    <!-- Master Logo Image Frame -->
                    <div class="w-20 h-20 bg-gradient-to-tr from-[#CDBCFF] to-[#EAE3FF] rounded-full flex items-center justify-center shadow-inner relative border border-white">
                        <span class="material-symbols-outlined text-5xl text-[#6D28D9] font-light">smart_toy</span>
                        <span class="material-symbols-outlined absolute -top-1 -right-1 text-amber-400 text-xl font-bold animate-pulse">sparkles</span>
                    </div>
                </div>
                
                <!-- Main Typography Headers Group -->
                <div id="textHeaders" class="transition-all-smooth">
                    <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-[#111827]">
                        Kewa Smart <span class="text-[#5B21B6] bg-gradient-to-r from-[#7C3AED] to-[#5B21B6] bg-clip-text text-transparent">AI</span>
                    </h1>
                    <p class="text-gray-500 font-medium text-sm sm:text-base mt-2" id="appSubtitle">
                        Your smart AI assistant for anything you need.
                    </p>
                </div>

                <!-- Initial Contextual Handshake Banner (Wave Greeting) -->
                <div id="initialHandshake" class="flex flex-col items-center justify-center mt-12 transition-all-smooth">
                    <div class="text-3xl mb-2 animate-bounce">👋</div>
                    <p class="text-gray-600 font-semibold text-[15px] sm:text-lg tracking-wide">Hi! How can I help you today?</p>
                </div>
            </div>

            <!-- Active Messages Dynamic Container Array Layout -->
            <div id="chatMessageStream" class="hidden flex flex-col gap-6 w-full max-w-4xl mx-auto pb-4 mt-4">
                <!-- Chat elements auto-populate here seamlessly -->
            </div>

        </main>

        <!-- --- 3. BOTTOMLINE INPUT ENGINE DOCK --- -->
        <footer class="p-4 bg-transparent shrink-0 flex justify-center w-full z-10">
            <!-- Master Dock Wrapper Pill -->
            <div class="w-full max-w-4xl bg-white min-h-[56px] rounded-2xl border border-[#DCD6FD] flex items-center px-3 sm:px-4 gap-2 sm:gap-3 shadow-[0_10px_30px_-10px_rgba(124,58,237,0.08)] focus-within:border-[#7C3AED] transition-all-smooth">
                
                <!-- VIP Crown Label Pill Container -->
                <button class="flex items-center gap-1 bg-[#F5F1FF] border border-[#E3D8FF] text-[#6D28D9] px-2.5 py-1.5 rounded-xl text-xs font-black tracking-wider hover:bg-[#EAE3FF] transition-all cursor-pointer shrink-0">
                    <span class="material-symbols-outlined text-sm text-amber-500 font-fill block">crown</span>
                    <span class="hidden xs:block">VIP</span>
                </button>

                <!-- Functional Control Action: Add Attachment -->
                <button class="w-8 h-8 flex items-center justify-center text-gray-500 hover:text-gray-800 hover:bg-gray-100/80 rounded-xl transition-all cursor-pointer shrink-0">
                    <span class="material-symbols-outlined text-[22px] block">add</span>
                </button>

                <!-- Clean Main Textarea/Input Core Interface -->
                <input type="text" id="chatEngineInput" placeholder="Type your message here..." class="flex-1 bg-transparent border-none outline-none text-gray-800 placeholder-gray-400 font-medium text-sm sm:text-base h-full py-3 min-w-0">

                <!-- Functional Control Action: Voice Input (Mic) -->
                <button class="w-8 h-8 flex items-center justify-center text-gray-500 hover:text-[#7C3AED] hover:bg-[#F5F1FF] rounded-full border border-gray-200 transition-all cursor-pointer shrink-0">
                    <span class="material-symbols-outlined text-[18px] block">mic</span>
                </button>

                <!-- Functional Control Action: Text-to-Speech Output (Volume) -->
                <button class="w-8 h-8 flex items-center justify-center text-gray-500 hover:text-[#7C3AED] hover:bg-[#F5F1FF] rounded-full border border-gray-200 transition-all cursor-pointer shrink-0">
                    <span class="material-symbols-outlined text-[18px] block">volume_up</span>
                </button>

                <!-- Core Command Dispatch Trigger -->
                <button id="dispatchMsgBtn" class="w-9 h-9 bg-[#4F46E5] hover:bg-[#4338CA] text-white rounded-full flex items-center justify-center shadow-md shadow-indigo-600/20 transition-all transform active:scale-95 cursor-pointer shrink-0">
                    <span class="material-symbols-outlined text-base block ml-0.5 transform -rotate-15">send</span>
                </button>

            </div>
        </footer>

    </div>

    <!-- --- 4. ENGINE INTERACTIVE DISPLAY INTERACTION MANAGEMENT SCRIPT --- -->
    <script>
        const chatEngineInput = document.getElementById('chatEngineInput');
        const dispatchMsgBtn = document.getElementById('dispatchMsgBtn');
        const dynamicHeaderBlock = document.getElementById('dynamicHeaderBlock');
        const mascotWrapper = document.getElementById('mascotWrapper');
        const textHeaders = document.getElementById('textHeaders');
        const appSubtitle = document.getElementById('appSubtitle');
        const initialHandshake = document.getElementById('initialHandshake');
        const chatMessageStream = document.getElementById('chatMessageStream');
        const chatWindow = document.getElementById('chatWindow');

        function triggerUILayoutShift() {
            dynamicHeaderBlock.classList.remove('my-auto', 'text-center');
            dynamicHeaderBlock.classList.add('border-b', 'border-gray-100/50', 'pb-4', 'flex-row', 'items-center', 'justify-start', 'text-left', 'w-full', 'max-w-4xl', 'mx-auto', 'gap-4');
            
            mascotWrapper.classList.remove('mb-4');
            mascotWrapper.querySelector('.w-20').classList.replace('w-20', 'w-12');
            mascotWrapper.querySelector('.w-20').classList.replace('h-20', 'h-12');
            mascotWrapper.querySelector('.text-5xl').classList.replace('text-5xl', 'text-2xl');
            
            textHeaders.querySelector('h1').classList.replace('text-3xl', 'text-lg');
            textHeaders.querySelector('h1').classList.replace('sm:text-4xl', 'sm:text-xl');
            appSubtitle.classList.add('hidden');
            initialHandshake.classList.add('hidden');
            
            chatMessageStream.classList.remove('hidden');
        }

        function pushUserMessage() {
            const promptValue = chatEngineInput.value.trim();
            if (!promptValue) return;

            if (chatMessageStream.classList.contains('hidden')) {
                triggerUILayoutShift();
            }

            const userBubbleNode = `
                <div class="flex items-start gap-3 justify-end w-full">
                    <div class="bg-gradient-to-tr from-[#6366F1] to-[#4F46E5] text-white text-[15px] px-4 py-2.5 rounded-2xl rounded-tr-none max-w-[80%] shadow-sm font-medium tracking-wide">
                        ${promptValue}
                    </div>
                </div>
            `;
            
            chatMessageStream.insertAdjacentHTML('beforeend', userBubbleNode);
            chatEngineInput.value = '';
            chatWindow.scrollTop = chatWindow.scrollHeight;

            setTimeout(() => {
                const mockResponseNode = `
                    <div class="flex items-start gap-3 w-full">
                        <div class="w-8 h-8 bg-[#F5F1FF] text-[#6D28D9] rounded-full flex items-center justify-center border border-[#E3D8FF] shrink-0 shadow-sm">
                            <span class="material-symbols-outlined text-base">smart_toy</span>
                        </div>
                        <div class="bg-white border border-gray-100 text-gray-800 text-[15px] px-4 py-2.5 rounded-2xl rounded-tl-none max-w-[80%] shadow-sm leading-relaxed font-medium">
                            Frontend design pure <b>100% pixel-perfect</b> matched ho chuka hai, boss! Ab aap jab bologe, tab isme JavaScript Fetch logic jod kar isko aapki Python backend standard API se integrate kar denge. 🚀
                        </div>
                    </div>
                `;
                chatMessageStream.insertAdjacentHTML('beforeend', mockResponseNode);
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }, 750);
        }

        dispatchMsgBtn.addEventListener('click', pushUserMessage);
        chatEngineInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') pushUserMessage();
        });
    </script>
</body>
</html>
